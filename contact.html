<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="foundation.css">
    <link rel="stylesheet" href="contact.css">
    
    <!-- Font import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Eczar:wght@400..800&family=Inconsolata:wdth,wght@50..200,200..900&family=Kode+Mono:wght@400..700&family=Laila:wght@300;400;500;600;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

</head>
<body>
    <nav>
        <a href="index.html" style="font-size: 40px; margin-right: auto;">Alice<span class="highlight">.</span></a>
        
        <div class="pages" id="pages">
            <span class="closeBtn" onclick="closeMenu()">&times;</span>

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="innerContact">Contact</a>
        </div>
        <a href="contact.html" class="contactBtn">Contact</a>
        
        <div class="menuBtn" id="menuBtn" onclick="openMenu()">
            ☰
        </div>
    </nav>

    <h1>Get In Touch</h1>
    <p>
        Interested in working together? Let’s create something memorable! Reach out to discuss potential collaborations, campaigns, or projects.
    </p>

    <form action="">
        <label for="name">Name</label>  <div class="tab"></div>
        <input type="text" required> 
        <div class="break"></div>

        <label for="email">Email</label>    <div class="tab"></div>
        <input type="email" required>   
        <div class="break"></div>

        <label for="Topic">Topic</label>    <div class="tab"></div>
        <input type="text" required>    
        <div class="break"></div>

        <label for="message">Message</label>    <div class="tab"></div>    
        <textarea name="message" id="message" style="border-radius:2rem;" ></textarea>
        <div class="break"></div>
        <input type="submit" name="sendBtn" class="sendBtn" id="sendBtn" value="Send">

    </form>
    

    <script src="script.js"></script>

</body>
</html>
